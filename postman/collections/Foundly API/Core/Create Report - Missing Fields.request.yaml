$kind: http-request
name: Create Report - Missing Fields
method: POST
url: '{{baseUrl}}/api/core/reports/'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"item_name": "Wallet"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
