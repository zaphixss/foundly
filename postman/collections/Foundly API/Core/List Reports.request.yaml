$kind: http-request
name: List Reports
method: GET
url: '{{baseUrl}}/api/core/reports/'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has results (paginated)", function () {
          pm.expect(pm.response.json()).to.have.property('results');
      });
      pm.test("Response has count", function () {
          pm.expect(pm.response.json()).to.have.property('count');
      });
