$kind: http-request
name: Get Report by ID
method: GET
url: '{{baseUrl}}/api/core/report/{{reportId}}/'
order: 12000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has item_name", function () {
          pm.expect(pm.response.json()).to.have.property('item_name');
      });
      pm.test("Response has report_type", function () {
          pm.expect(pm.response.json()).to.have.property('report_type');
      });
