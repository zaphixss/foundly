$kind: http-request
name: Update Category
method: PUT
url: '{{baseUrl}}/api/core/category/{{categoryId}}/'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title": "Electronics & Gadgets"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("response.title equals Electronics & Gadgets", function () {
          pm.expect(pm.response.json().title).to.eql("Electronics & Gadgets");
      });
