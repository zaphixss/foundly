$kind: http-request
name: Delete Category
method: DELETE
url: '{{baseUrl}}/api/core/category/{{categoryId}}/'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
