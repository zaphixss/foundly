$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/auth/register/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "testuser@example.com",
      "username": "testuser",
      "password": "TestPass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response has access token", function () {
          pm.expect(pm.response.json()).to.have.property('access');
      });
      pm.test("Response has refresh token", function () {
          pm.expect(pm.response.json()).to.have.property('refresh');
      });
      pm.test("Response has user.email", function () {
          pm.expect(pm.response.json().user).to.have.property('email');
      });
      pm.collectionVariables.set("accessToken", pm.response.json().access);
      pm.collectionVariables.set("refreshToken", pm.response.json().refresh);
