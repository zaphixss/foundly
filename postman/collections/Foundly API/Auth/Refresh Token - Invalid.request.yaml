$kind: http-request
name: Refresh Token - Invalid
method: POST
url: '{{baseUrl}}/api/auth/refresh/'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"refresh": "invalidtoken123"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
