$kind: http-request
name: Login - Missing Fields
method: POST
url: '{{baseUrl}}/api/auth/login/'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "testuser@example.com"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function () {
          pm.response.to.have.status(400);
      });
